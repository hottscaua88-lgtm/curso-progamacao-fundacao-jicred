<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passo Livre | Loja Oficial</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* RESET BÁSICO */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #000000; color: #ffffff; font-family: 'Montserrat', sans-serif; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }

        /* HEADER E NAVEGAÇÃO */
        .top-header {
            background-color: #008744;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-area { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.5rem; }
        .search-bar { width: 40%; }
        .search-bar input { width: 100%; padding: 8px 15px; border-radius: 20px; border: none; outline: none; }
        .icons-area { display: flex; gap: 15px; font-size: 1.2rem; }

        .sub-nav {
            background-color: #ffffff;
            color: #000000;
            padding: 10px 5%;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .sub-nav ul { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; }

        .hero-banner {

            color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 5%;
            margin-bottom: 20px;
            position: relative;
