<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passo Livre | Drops Exclusivos</title>
    <style>
        /* Estilo Geral - Vibe Dark/Streetwear */
        body { 
            background-color: #0b0b0b; 
            color: #ffffff;
            font-family: 'Arial', sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100vh;
        }

        /* Container Centralizado */
        .container {
            padding: 20px;
        }

        /* Título de Impacto */
        h1 { 
            color: #00ff66; /* Verde Neon/HWB Puro */
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        /* Subtítulo */
        p { 
            color: #a0a0a0; 
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        /* Botão de Destaque (CTA) */
        .btn-drop {
            background-color: #00ff66;
            color: #000000;
            padding: 12px 30px;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 4px;
            transition: 0.3s;
            letter-spacing: 1px;
        }

        .btn-drop:hover {
            background-color: #ffffff;
            box-shadow: 0 0 15px #00ff66;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Passo Livre</h1>
        <p>Este é o começo do seu novo e-commerce no GitHub Pages.</p>
        <a href="#" class="btn-drop">Ver Lançamentos</a>
    </div>

</body>
</html>
