<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Cadastro</title>
</head>
<body>
    <h2>Atividade 1</h2>
<form action="processa.php" method="post">
    <label>Nome:</label>
    <input type="text" name="nome">

    <br><br>

    <label>Email:</label>

    <br><br>

<h2>Atividade 2</h2>
<form action="processa.php" method="post">

     <input type="reset" value="Limpar">

     <br><br>

     <h2>Atividade 3</h2>
     <form action="processa.php" method="post">
    <label>Email:</label>
    <input type="text" name="nome">
     <input type="submit" value="Enviar">

<h2>Atividade 4</h2>
    <h2>Cadastro de Usuário</h2>
    
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha">
        <br><br>

        <label for="nascimento">Data de Nascimento:</label>
        <input type="date" id="nascimento" name="nascimento">
        <br><br>

        <label>Gênero:</label>
        <input type="radio" id="masculino" name="genero" value="masculino">
        <label for="masculino">Masculino</label>
        
        <input type="radio" id="feminino" name="genero" value="feminino">
        <label for="feminino">Feminino</label>
        <br><br>

        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>

        <br><br>

        <form>
            <h2>Atividade 5 </h2>
    <h3>Escolha seus Hobbies:</h3>
    
    <input type="checkbox" id="ler" name="hobbies" value="ler">
    <label for="ler">Ler</label><br>

    <input type="checkbox" id="esportes" name="hobbies" value="esportes">
    <label for="esportes">Esportes</label><br>

    <input type="checkbox" id="programar" name="hobbies" value="programar">
    <label for="programar">Programar</label><br>

    <input type="checkbox" id="musica" name="hobbies" value="musica">
    <label for="musica">Música</label><br>
    
    <br>
    <button type="submit">Enviar Hobbies</button>
</form>

<br><br>

<h2>Atividade 6</h2>
<form>
    <label for="curso">Selecione seu Curso:</label>
    <select id="curso" name="curso">
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="javascript">JavaScript</option>
    </select>
    <br><br>
    <button type="submit">Selecionar Curso</button>
</form>

<br><br>

<h2>Atividade 7</h2>
<form>
    <label for="mensagem">Sua Mensagem:</label><br>
    <textarea id="mensagem" name="mensagem" rows="4" cols="40" placeholder="Digite sua mensagem aqui..."></textarea>
    <br><br>
    <button type="submit">Enviar Mensagem</button>
</form> 

<br><br>

<h2>Atividade 8</h2>
<form> 
    <label for="arquivo">Selecione um arquivo:</label>
    <input type="file" id="arquivo" name="arquivo">
    <br><br>
    <button type="submit">Enviar foto</button>
    </form>

    <br><br>

    <h2>Atividade 9</h2>
    <form>
    <h3>Qual linguagem deseja aprender?</h3>
    
    <input type="radio" id="quero-html" name="linguagem_desejada" value="html">
    <label for="quero-html">HTML</label><br>

    <input type="radio" id="quero-css" name="linguagem_desejada" value="css">
    <label for="quero-css">CSS</label><br>

    <input type="radio" id="quero-js" name="linguagem_desejada" value="js">
    <label for="quero-js">JavaScript</label><br>
    
    <br>
    <button type="submit">Enviar Resposta</button>
</form>
</body>
</html>
